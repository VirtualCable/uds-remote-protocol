[package]
name = "service"
description = "UDS Remote Protocol orchestrator service: session lifecycle, agent spawning"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
protocol.workspace = true
server-config.workspace = true
service-proto.workspace = true
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
transport.workspace = true
crypt.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "macros"] }
udscredprov = { path = "../udscredprov" }
widestring = "1.2"
windows = { workspace = true, features = [
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Networking_WinSock",
] }

[[bin]]
name = "udsrp-service"
path = "src/main.rs"
