[package]
name = "udscredprov-ctl"
description = "Test/verification harness for the UDS credential provider: plays the pipe-server role of the uds-rp service (Windows only)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
udscredprov = { path = "../udscredprov" }

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

[lints]
workspace = true
