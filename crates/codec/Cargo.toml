[package]
name = "codec"
description = "Video/audio codec traits and implementations (VP9, Opus) behind features"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
codec-vp9 = ["dep:vpx-sys"]
codec-vp8 = ["dep:vpx-sys"]
codec-jpeg = ["dep:turbojpeg"]
codec-ladder = ["codec-jpeg", "codec-vp9"]
codec-opus = ["dep:opus"]
codec-mf = ["dep:windows"]
codec-h264 = ["dep:libloading"]
codec-nvenc = ["dep:libloading", "dep:windows"]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
libloading = { workspace = true, optional = true }
vpx-sys = { workspace = true, optional = true }
turbojpeg = { workspace = true, optional = true }
opus = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[[example]]
name = "bench_cam_decode"
required-features = ["codec-vp9", "codec-jpeg"]
