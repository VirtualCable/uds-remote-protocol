[package]
name = "codec"
description = "Video/audio codec traits and implementations (VP9, Opus) behind features"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
codec-vp9 = ["dep:vpx-sys"]
codec-vp8 = ["dep:vpx-sys"]
codec-jpeg = ["dep:turbojpeg"]
codec-ladder = ["codec-jpeg", "codec-vp9"]
codec-opus = ["dep:opus"]

[dependencies]
thiserror.workspace = true
vpx-sys = { workspace = true, optional = true }
turbojpeg = { workspace = true, optional = true }
opus = { workspace = true, optional = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }
