[package]
name = "server"
description = "Server side of the protocol: session, screen capture and input injection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
windows-capture = ["dep:windows"]
vp9 = ["codec/codec-vp9"]
vp8 = ["codec/codec-vp8"]
jpeg = ["codec/codec-jpeg"]
ladder = ["codec/codec-ladder"]

[dependencies]
protocol.workspace = true
transport.workspace = true
crypt.workspace = true
codec.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
codec = { workspace = true, features = ["codec-vp9"] }
turbojpeg = "1.5"
webp = "0.3"
