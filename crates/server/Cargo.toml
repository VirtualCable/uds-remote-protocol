[package]
name = "server"
description = "Server side of the protocol: session, screen capture and input injection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["opus"]
# windows-capture adds the heavy capture/pipeline deps; the `windows` crate
# itself is a permanent cfg(windows) dependency because feature-less modules
# (secure_pipe, clipboard, ...) use it under plain cfg(windows).
windows-capture = ["dep:image", "dep:udsscard-proto", "dep:vcam", "codec-mf"]
codec-mf = ["codec/codec-mf"]
codec-nvenc = ["codec/codec-nvenc"]
vp9 = ["codec/codec-vp9"]
jpeg = ["codec/codec-jpeg"]
ladder = ["codec/codec-ladder"]
opus = ["codec/codec-opus"]

[dependencies]
protocol.workspace = true
server-config.workspace = true
transport.workspace = true
codec.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
# Not optional: plain cfg(windows) modules use it without windows-capture.
windows = { workspace = true, features = [
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Shutdown",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_Networking_WinSock",
    "Win32_System_RemoteDesktop",
] }
vcam = { path = "../vcam", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
udsscard-proto = { path = "../udsscard-proto", optional = true }

[dev-dependencies]
codec = { workspace = true, features = ["codec-vp9"] }
turbojpeg = "1.5"
webp = "0.3"
tempfile = "3"
