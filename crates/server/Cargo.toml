[package]
name = "server"
description = "Server side of the protocol: session, screen capture and input injection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["opus"]
windows-capture = ["dep:windows", "dep:image", "dep:udsdisp-ctl"]
vp9 = ["codec/codec-vp9"]
vp8 = ["codec/codec-vp8"]
jpeg = ["codec/codec-jpeg"]
ladder = ["codec/codec-ladder"]
opus = ["codec/codec-opus"]

[dependencies]
protocol.workspace = true
service-proto.workspace = true
transport.workspace = true
crypt.workspace = true
codec.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
udsdisp-ctl = { path = "../udsdisp-ctl", optional = true }

[dev-dependencies]
codec = { workspace = true, features = ["codec-vp9"] }
turbojpeg = "1.5"
webp = "0.3"
tempfile = "3"
