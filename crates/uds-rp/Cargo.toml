[package]
name = "uds-rp"
description = "Public facade of the UDS remote desktop protocol framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Codec/audio forwarding to the client crate: consumers (the UDS launcher)
# pick decoders through the facade instead of depending on `client` directly.
default = []
vp9 = ["client/vp9"]
jpeg = ["client/jpeg"]
audio = ["client/audio"]
h264 = ["client/h264"]

[dependencies]
protocol.workspace = true
transport.workspace = true
codec.workspace = true
server.workspace = true
client.workspace = true
