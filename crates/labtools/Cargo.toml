[package]
name = "labtools"
description = "Laboratory control/verification tools for the UDS drivers (udsaudio, udsscard, udscredprov) — Windows only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
udsscard-proto = { path = "../udsscard-proto" }
udscredprov = { path = "../udscredprov" }

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }

[[bin]]
name = "udsaudio-ctl"
path = "src/bin/udsaudio-ctl.rs"

[[bin]]
name = "udsscard-ctl"
path = "src/bin/udsscard-ctl.rs"

[[bin]]
name = "udscredprov-ctl"
path = "src/bin/udscredprov-ctl.rs"
