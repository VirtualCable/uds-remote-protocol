[package]
name = "vcam-ipc"
description = "Shared-memory layout and helpers between the UDS RP server and the vcam DirectShow filter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Windows shared-memory writer/reader (CreateFileMappingW etc.).
ipc = ["dep:anyhow", "dep:windows"]

[dependencies]
anyhow = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_System_IO",
] }
