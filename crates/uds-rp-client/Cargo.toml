[package]
name = "uds-rp-client"
description = "Reference standalone client for the UDS remote protocol (winit + wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The reference client ships with every codec so it can evaluate any server
# preset out of the box.
[dependencies]
client = { workspace = true, features = ["vp9", "vp8", "jpeg", "audio"] }
client-gui.workspace = true
protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
