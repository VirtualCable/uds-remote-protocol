[workspace]
resolver = "3"
members = [
    "crates/uds-rp",
    "crates/protocol",
    "crates/transport",
    "crates/crypt",
    "crates/codec",
    "crates/server",
    "crates/client",
    "crates/testclient",
    "crates/vpx-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Virtual Cable S.L."]
repository = "https://github.com/VirtualCable/uds-remote-protocol"

[workspace.dependencies]
# Internal dependencies
protocol = { path = "crates/protocol" }
transport = { path = "crates/transport" }
crypt = { path = "crates/crypt" }
codec = { path = "crates/codec" }
vpx-sys = { path = "crates/vpx-sys" }
server = { path = "crates/server" }
client = { path = "crates/client" }

# Common external dependencies
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
getrandom = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
turbojpeg = "1.5"
opus = "0.3"
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
bytes = "1.12"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
# Doc style lints that add no value in this project.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
