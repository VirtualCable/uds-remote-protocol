[workspace]
resolver = "3"
members = [
    "crates/uds-rp",
    "crates/channels",
    "crates/protocol",
    "crates/transport",
    "crates/crypt",
    "crates/codec",
    "crates/server",
    "crates/server-config",
    "crates/client",
    "crates/vpx-sys",
    "crates/udscredprov",
    "crates/service",
    "crates/service-proto",
    "crates/broker",
    "crates/udsscard-proto",
    "crates/vcam",
    "crates/labclient",
    "crates/labtools",
]
# The Windows kernel audio driver lives in its own workspace (drivers/):
# it needs panic="abort" profiles (workspace-wide setting), no_std, and a
# WDK environment that only exists on Windows build machines.
exclude = ["drivers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Virtual Cable S.L."]
repository = "https://github.com/VirtualCable/uds-remote-protocol"

[workspace.dependencies]
# Internal dependencies
protocol = { path = "crates/protocol" }
service-proto = { path = "crates/service-proto" }
transport = { path = "crates/transport" }
crypt = { path = "crates/crypt" }
codec = { path = "crates/codec" }
vpx-sys = { path = "crates/vpx-sys" }
server = { path = "crates/server" }
server-config = { path = "crates/server-config" }
client = { path = "crates/client" }
channels = { path = "crates/channels" }

# Common external dependencies
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1"
tracing = "0.1"
pcsc = "2.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
turbojpeg = "1.5"
opus = "0.3"
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
postcard = { version = "1.1", features = ["alloc"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
libcrux-ml-kem = "0.0.11"
rand = "0.10"
bytes = "1.12"
flume = { version = "0.12", features = ["async"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
toml = "0.9"
winit = "0.30"
wgpu = "30"
wgpu_text = "30"
bytemuck = { version = "1", features = ["derive"] }
clipboard-rs = "0.3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
# Doc style lints that add no value in this project.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# Keep symbols in the vcam release build: the DLL runs inside arbitrary
# consumer processes (OBS, browsers) and the .pdb is what lets us resolve
# crash offsets in the field. The DLL itself stays small; debug info goes
# to the separate vcam.pdb.
[profile.release.package.vcam]
debug = true
