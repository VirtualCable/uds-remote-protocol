[workspace]
# udsscard has its own workspace: wdk-sys allows a single driver model per
# dependency graph (udsaudio is WDM, udsscard is UMDF).
members = ["udsaudio"]
resolver = "3"

# The kernel driver needs its own workspace: panic=abort is a workspace-wide
# profile setting and must not leak into the user-mode crates.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
