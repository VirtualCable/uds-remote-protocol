[package]
name = "udsscard"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Virtual Cable S.L."]
repository = "https://github.com/VirtualCable/uds-remote-protocol"

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 31

[lib]
crate-type = ["cdylib"]

# WDK crates only exist on Windows build machines (they require the WDK at
# build time).
[target.'cfg(windows)'.build-dependencies]
wdk-build = "0.5.1"

[target.'cfg(windows)'.dependencies]
wdk = "0.4.1"
wdk-sys = "0.5.1"

[features]
default = []

# Own workspace: wdk-sys allows a single driver model per dependency graph
# (drivers/ is WDM, this crate is UMDF).
[workspace]
